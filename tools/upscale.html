<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba de ampliación (temporal)</title>
<meta name="robots" content="noindex">
<style>body{background:#000;color:#fff;font:14px system-ui;margin:16px}#st{white-space:pre-wrap}canvas{max-width:100%}</style>
</head><body>
<p id="st">cargando…</p>
<canvas id="out"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upscaler@1.0.0-beta.19/dist/browser/umd/upscaler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-thick@1.0.0-beta.14/dist/umd/2x.min.js"></script>
<script>
window.__done = null; window.__err = null;
(async function () {
  var st = document.getElementById('st');
  function log(m){ st.textContent += '\n' + m; }
  try {
    var src = new URLSearchParams(location.search).get('src');
    if (!src) throw new Error('falta ?src=');
    var modelKey = Object.keys(window).find(k => /ESRGAN/i.test(k));
    if (!modelKey) throw new Error('modelo no cargado');
    var model = window[modelKey]; if (model && model.default) model = model.default;
    log('modelo: ' + modelKey + ' · backend: ' + tf.getBackend());
    var img = new Image(); img.crossOrigin = 'anonymous';
    await new Promise((ok, ko) => { img.onload = ok; img.onerror = () => ko(new Error('no se pudo cargar la imagen')); img.src = src; });
    log('imagen: ' + img.naturalWidth + '×' + img.naturalHeight);
    var up = new Upscaler({ model: model });
    var t0 = performance.now();
    var out = await up.upscale(img, { output: 'base64', patchSize: 64, padding: 4, progress: function (p) { st.textContent = st.textContent.replace(/\nprogreso.*$/, '') + '\nprogreso ' + Math.round(p * 100) + ' %'; } });
    log('hecho en ' + Math.round((performance.now() - t0) / 1000) + ' s');
    var o = new Image(); await new Promise(ok => { o.onload = ok; o.src = out; });
    var c = document.getElementById('out'); c.width = o.naturalWidth; c.height = o.naturalHeight; c.getContext('2d').drawImage(o, 0, 0);
    log('salida: ' + c.width + '×' + c.height);
    window.__done = out;
  } catch (e) { window.__err = String(e); log('ERROR ' + e); }
})();
</script>
</body></html>
