<!-- sc-crypto-trace: al copiar una dirección, un trazo del color de la cripto recorre el perímetro del QR (grosor --sq-w, 3 px)
     en un solo gesto (arriba → derecha → abajo → izquierda, 4 × 0,13 s), el brillo sube de golpe y, desde ese pico, brillo,
     halo y marco se apagan juntos en una sola curva (1 s): entrada rápida, salida pausada y uniforme -->
<style>
#streetcat-crypto-donations-v1 .scd-qr-frame{position:relative}
#streetcat-crypto-donations-v1 .scq-ring{--sq-w:3px;--sq-d:.13s;position:absolute;inset:calc(var(--sq-w) * -1);pointer-events:none;opacity:0;transition:opacity .5s ease-out}
#streetcat-crypto-donations-v1 .scq-ring.on{opacity:1;transition:none}
#streetcat-crypto-donations-v1 .scq-ring i{position:absolute;display:block;transition:transform var(--sq-d) linear}
#streetcat-crypto-donations-v1 .scq-ring.rst,#streetcat-crypto-donations-v1 .scq-ring.rst i{transition:none!important;animation:none!important}
#streetcat-crypto-donations-v1 .scq-ring .t{top:0;left:0;width:100%;height:var(--sq-w);transform-origin:left center;transform:scaleX(0);background:var(--sq-t)}
#streetcat-crypto-donations-v1 .scq-ring .r{top:0;right:0;width:var(--sq-w);height:100%;transform-origin:center top;transform:scaleY(0);background:var(--sq-r);transition-delay:var(--sq-d)}
#streetcat-crypto-donations-v1 .scq-ring .b{bottom:0;right:0;width:100%;height:var(--sq-w);transform-origin:right center;transform:scaleX(0);background:var(--sq-b);transition-delay:calc(var(--sq-d) * 2)}
#streetcat-crypto-donations-v1 .scq-ring .l{bottom:0;left:0;width:var(--sq-w);height:100%;transform-origin:center bottom;transform:scaleY(0);background:var(--sq-l);transition-delay:calc(var(--sq-d) * 3)}
#streetcat-crypto-donations-v1 .scq-ring.drawn i{transform:none}
#streetcat-crypto-donations-v1 .scq-ring.flash{animation:scqOut 1s cubic-bezier(.3,.1,.3,1) forwards}
@keyframes scqOut{0%{opacity:1;filter:brightness(1) drop-shadow(0 0 0 transparent)}10%{opacity:1;filter:brightness(2) drop-shadow(0 0 7px var(--sq-g))}100%{opacity:0;filter:brightness(1.3) drop-shadow(0 0 7px transparent)}}
#streetcat-crypto-donations-v1 .scq-ring[data-coin="bitcoin"]{--sq-t:#F7931A;--sq-r:#F7931A;--sq-b:#F7931A;--sq-l:#F7931A;--sq-g:#F7931A}
#streetcat-crypto-donations-v1 .scq-ring[data-coin="ethereum"]{--sq-t:#627EEA;--sq-r:#627EEA;--sq-b:#627EEA;--sq-l:#627EEA;--sq-g:#627EEA}
#streetcat-crypto-donations-v1 .scq-ring[data-coin="usdt-tron"]{--sq-t:#26A17B;--sq-r:#26A17B;--sq-b:#26A17B;--sq-l:#26A17B;--sq-g:#26A17B}
#streetcat-crypto-donations-v1 .scq-ring[data-coin="solana"]{--sq-t:linear-gradient(90deg,#9945FF,#579BCA);--sq-r:linear-gradient(180deg,#579BCA,#14F195);--sq-b:linear-gradient(90deg,#579BCA,#14F195);--sq-l:linear-gradient(180deg,#9945FF,#579BCA);--sq-g:#579BCA}
@media (prefers-reduced-motion:reduce){#streetcat-crypto-donations-v1 .scq-ring i{transition:none}#streetcat-crypto-donations-v1 .scq-ring.flash{animation:none}}
/* sin movimiento: el marco aparece, espera y se desvanece (transición de opacidad de .5 s) */
</style>
<script>
(function(){
  function init(){
    var root=document.getElementById('streetcat-crypto-donations-v1');
    if(!root||root.__scq) return; root.__scq=true;
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function ringOf(frame,coin){
      var r=frame.querySelector(':scope > .scq-ring');
      if(!r){r=document.createElement('span');r.className='scq-ring';r.setAttribute('aria-hidden','true');r.innerHTML='<i class="t"></i><i class="r"></i><i class="b"></i><i class="l"></i>';frame.appendChild(r);}
      r.setAttribute('data-coin',coin); return r;
    }
    function reset(r){r.classList.add('rst');r.classList.remove('drawn','flash','on');void r.offsetWidth;r.classList.remove('rst');}
    function hide(r){clearTimeout(r.__t);r.classList.remove('on','flash');r.__t=setTimeout(function(){reset(r);},540);}   // solo sin movimiento
    function show(card){
      var f=card.querySelector('.scd-qr-frame'); if(!f) return;
      var r=ringOf(f,card.getAttribute('data-coin')||''); clearTimeout(r.__t);
      reset(r); r.classList.add('on'); void r.offsetWidth; r.classList.add('drawn');
      r.__t=setTimeout(function(){ if(reduce){hide(r);} else {r.classList.add('flash');} }, reduce?700:560);   // tras los 4 × 130 ms del trazo
    }
    // la animación de salida deja el marco ya invisible: se reinicia en seco, sin segunda transición
    root.addEventListener('animationend',function(e){var r=e.target;if(r.classList&&r.classList.contains('scq-ring')&&e.animationName==='scqOut'){clearTimeout(r.__t);reset(r);}});
    new MutationObserver(function(ms){
      var seen=[];
      ms.forEach(function(m){
        var n=m.target, el=n.nodeType===1?n:n.parentElement;
        var b=el&&el.closest?el.closest('.scd-copy'):null;
        if(b&&seen.indexOf(b)<0&&/^COPIED/.test((b.textContent||'').trim())){seen.push(b);var c=b.closest('.scd-card');if(c)show(c);}
      });
    }).observe(root,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
<!-- /sc-crypto-trace -->
