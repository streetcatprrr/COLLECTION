<!-- sc-donate-black: el formulario de Donate (Donorbox) en negro con líneas blancas finas, como el resto de la web.
     Paso 1: pestañas e importes con contorno (el elegido se rellena de blanco), «Other amount» escribe en blanco,
     botones de pago con contorno y la misma letra que el de Apple Pay. Pasos 2 y 3: campos negros con contorno.
     Apple Pay es el control oficial de Stripe (tema negro, solo logotipo, elegido en Donorbox): se le da el mismo ancho
     que a los otros dos, un contorno blanco de 1 px y los otros dos copian su altura. Separación uniforme de 12 px.
     Se inyecta como <style> al final del shadow root del widget, solo en la página Donate. -->
<style id="sc-donate-black-light">
/* el elemento de Apple Pay vive fuera del shadow root (light DOM): mismo ancho que los otros botones, sin el zoom ni el
   recorte del ajuste antiguo de móvil, iframe en bloque y contorno blanco de 1 px pegado a su caja */
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget > [slot="express_checkout"]{display:block!important;position:relative!important;box-sizing:border-box!important;width:100%!important;max-width:270px!important;min-width:0!important;margin:0 auto!important;padding:0!important;overflow:hidden!important;border-radius:0!important}
/* marco de 1 px en una capa por encima del iframe (el iframe tapa el outline del contenedor) */
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget > [slot="express_checkout"]::after{content:""!important;position:absolute!important;inset:0!important;border:1px solid #fff!important;pointer-events:none!important;z-index:5!important;box-sizing:border-box!important}
/* Donorbox configura el botón rápido de Stripe con una sola fila y columna y «desbordamiento automático»: con Apple Pay y
   Link disponibles, Stripe pinta Apple Pay (≈78 % del ancho) y, a su derecha, un hueco y un botón «···» (≈22 %, proporcional).
   El contenedor interno mide 350 px para que Apple Pay salga de ≈272 px y el marco de 270 recorte el hueco y el «···».
   Donorbox entrega el botón en tema blanco (con el color del botón en negro o en blanco), así que se invierte:
   negro con el logotipo en blanco, igual que Crypto y Other. */
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget > [slot="express_checkout"] > div{width:350px!important;max-width:none!important}
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget > [slot="express_checkout"] iframe{zoom:1!important;clip-path:none!important;transform:none!important;filter:invert(1)!important;-webkit-filter:invert(1)!important}
/* mientras Stripe carga el botón, su elemento es invisible dentro del marco reservado; al medir, aparece en fundido */
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget.sc-wallet-expected:not(.sc-pay-live) > [slot="express_checkout"]{opacity:0!important}
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget.sc-pay-live > [slot="express_checkout"]{opacity:1!important;transition:opacity .3s ease!important}
/* el fundido de entrada de la tarjeta en ordenador pasa de 1,5 s a 0,8 s (en móvil ya era de 0,24 s) */
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget.sc-show{animation-duration:.8s!important}
</style>
