<!-- sc-donate-black: el formulario de Donate (Donorbox) en negro con líneas blancas finas, como el resto de la web.
     Paso 1: pestañas e importes con contorno (el elegido se rellena de blanco), «Other amount» escribe en blanco,
     botones de pago con contorno y la misma letra que el de Apple Pay. Pasos 2 y 3: campos negros con contorno.
     Apple Pay es el control oficial de Stripe (tema negro, solo logotipo, elegido en Donorbox): se le da el mismo ancho
     que a los otros dos, un contorno blanco de 1 px y los otros dos copian su altura. Separación uniforme de 12 px.
     Se inyecta como <style> al final del shadow root del widget, solo en la página Donate. -->
<style id="sc-donate-black-light">
/* el elemento de Apple Pay vive fuera del shadow root (light DOM): mismo ancho que los otros botones, sin el zoom ni el
   recorte del ajuste antiguo de móvil, iframe en bloque y contorno blanco de 1 px pegado a su caja */
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget > [slot="express_checkout"]{display:block!important;position:relative!important;box-sizing:border-box!important;width:100%!important;max-width:270px!important;min-width:0!important;margin:0 auto!important;padding:0!important;overflow:hidden!important;border-radius:0!important}
/* marco de 1 px en una capa por encima del iframe (el iframe tapa el outline del contenedor) */
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget > [slot="express_checkout"]::after{content:""!important;position:absolute!important;inset:0!important;border:1px solid #fff!important;pointer-events:none!important;z-index:5!important;box-sizing:border-box!important}
/* Donorbox configura el botón rápido de Stripe con una sola fila y columna y «desbordamiento automático»: con Apple Pay y
   Link disponibles, Stripe pinta Apple Pay (≈78 % del ancho) y, a su derecha, un hueco y un botón «···» (≈22 %, proporcional).
   El contenedor interno mide 350 px para que Apple Pay salga de ≈272 px y el marco de 270 recorte el hueco y el «···».
   Donorbox entrega el botón en tema blanco (con el color del botón en negro o en blanco), así que se invierte:
   negro con el logotipo en blanco, igual que Crypto y Other. */
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget > [slot="express_checkout"] > div{width:350px!important;max-width:none!important}
html:not(#sc-none) body#collection-6934b65250af903b74bf9bdb #page dbox-widget > [slot="express_checkout"] iframe{zoom:1!important;clip-path:none!important;transform:none!important;filter:invert(1)!important;-webkit-filter:invert(1)!important}
</style>
<script>
(function () {

      '--interval-selector-background:transparent;--interval-selector-border-color:' + W + ';--interval-selector-selected-background:' + W + ';--interval-selector-selected-text-color:' + K + ';--interval-selector-text-color:' + M + ';--interval-selector-filled-border:1px solid ' + W + ';--interval-selector-selected-border-width:1px;--interval-selector-selected-border-color:' + W + ';--interval-selector-focus-color:' + W + ';' +

      '--custom-amount-default-color:' + W + ';--custom-amount-small-color:' + M + ';--custom-amount-selected-placeholder-color:' + M + ';' +
      '--primary-button-color:transparent;--primary-button-text-color:' + W + ';--primary-button-shape:0;--primary-button-border-width:1px;--primary-button-border-color:' + W + ';' +
      '--secondary-buttons-color:' + W + ';--secondary-buttons-selected-color:' + W + ';--secondary-buttons-text-color:' + W + ';--secondary-buttons-selected-text-color:' + K + ';--secondary-buttons-shape:0;' +
      '--checkbox-radio-selected-background:' + W + ';--checkbox-radio-selected-color:' + K + ';--powered-by-text-color:' + W + '}',

    ':host #loading,' + F + ',' + F + ' #donation_form_content,' + F + ' #page_select_amount,' + F + ' #page_donor_info,' + F + ' #page_payment,' + F + ' #page_thank_you{background:' + K + '!important;color:' + W + '!important}',
    F + '{border:1px solid ' + W + '!important;box-shadow:none!important;border-radius:0!important}',
    F + '>header{background:' + K + '!important;border:0!important;border-bottom:1px solid ' + W + '!important;color:' + W + '!important}',
    P + 'fieldset,' + D + 'fieldset,' + Y + 'fieldset{background:transparent!important;background-color:transparent!important;box-shadow:none!important}',
    F + ' *{-webkit-text-fill-color:currentColor!important}',

    P + '#intervals label:has(input:checked){background:' + W + '!important;color:' + K + '!important}',

    P + '#suggested_amounts label,' + P + '#custom_amount label{background:transparent!important;border:1px solid ' + W + '!important;border-radius:0!important;box-shadow:none!important}',
    P + '#suggested_amounts label *,' + P + '#custom_amount label *{font-family:' + SERIF + '!important;color:' + W + '!important;background:transparent!important}',
    P + '#suggested_amounts label span{font-size:20px!important;font-weight:500!important}',
    P + '#suggested_amounts label:has(input:checked){background:' + W + '!important}',
    P + '#suggested_amounts label:has(input:checked) *{color:' + K + '!important}',
    P + '#custom_amount .custom-amount-placeholder{' + LABEL + '}',
    P + '#custom_amount input#custom_amount_input{font-size:22px!important;font-weight:500!important;caret-color:' + W + '!important;outline:none!important}',
    P + '#custom_amount input#custom_amount_input::placeholder{color:' + M + '!important}',
    ':host #donation_form#donation_form #page_select_amount#page_select_amount #custom_amount#custom_amount input#custom_amount_input{box-shadow:none!important;-webkit-box-shadow:none!important;background:transparent!important}',
    /* paso 1: comentario */
    P + '#comment{background:transparent!important;border:0!important;box-shadow:none!important}',
    P + '#comment>label{' + LABEL + '}',
    P + '#leave_a_comment{appearance:none!important;-webkit-appearance:none!important;width:12px!important;height:12px!important;border:1px solid ' + W + '!important;border-radius:0!important;background:transparent!important;margin:0 8px 0 0!important}',
    P + '#leave_a_comment:checked{background:' + W + '!important}',
    P + '#comment textarea{background:' + K + '!important;color:' + W + '!important;border:1px solid ' + W + '!important;border-radius:0!important;caret-color:' + W + '!important}',
    /* paso 1: Apple Pay (sección sin alto fijo ni texto «Pay with») y separación uniforme de 18 px entre los tres botones.
       El iframe de Stripe sobresale 4 px por arriba y por abajo de su sección (márgenes negativos propios), por eso 44 y 22 */
    P + '#express_checkout_section{height:auto!important;min-height:0!important;margin:44px 0 0!important;padding:0!important;text-align:center!important;overflow:visible!important}',
    P + '#express_checkout_section>p{display:none!important}',

    P + '#standard_checkout_section .sc-crypto-next.sc-crypto-pay:active,' + P + '#standard_checkout_section>button[type="submit"]:active{background:' + W + '!important;color:' + K + '!important;transition-duration:.09s!important}',
    P + '#standard_checkout_section .sc-crypto-next.sc-crypto-pay:focus-visible,' + P + '#standard_checkout_section>button[type="submit"]:focus-visible{outline:1px solid ' + W + '!important;outline-offset:3px!important}',
    /* pasos 2 y 3: campos, etiquetas, casillas y botón principal */
    D + 'label,' + Y + 'label{' + LABEL + '}',
    D + 'input[type="text"],' + D + 'input[type="email"],' + D + 'input[type="tel"],' + D + 'select,' + D + 'textarea,' + Y + 'input[type="text"],' + Y + 'select{background:' + K + '!important;color:' + W + '!important;border:1px solid ' + W + '!important;border-radius:0!important;box-shadow:none!important;caret-color:' + W + '!important;font-family:' + SERIF + '!important}',

    D + 'input:focus,' + Y + 'input:focus{outline:none!important;border-color:' + W + '!important}',
    D + 'img.icon{filter:invert(1)!important}',
    D + 'input[type="checkbox"],' + Y + 'input[type="checkbox"]{appearance:none!important;-webkit-appearance:none!important;width:12px!important;height:12px!important;border:1px solid ' + W + '!important;border-radius:0!important;background:transparent!important}',
    D + 'input[type="checkbox"]:checked,' + Y + 'input[type="checkbox"]:checked{background:' + W + '!important}',
    D + '.help-hint,' + Y + '.help-hint{border-color:' + M + '!important;color:' + M + '!important}',
    D + 'button[type="submit"],' + Y + '#submit_button{' + BTN + 'max-width:none!important}',

    D + 'button[type="submit"]:active,' + Y + '#submit_button:active{background:' + W + '!important;color:' + K + '!important;transition-duration:.09s!important}',
    Y + '#recaptcha_description,' + Y + '#recaptcha_description a{color:' + M + '!important}',

  ].join('');
  function mount() {
    var widget = document.querySelector('#page dbox-widget');
    var root = widget && widget.shadowRoot;
    if (!root) return false;
    var style = root.querySelector('#sc-donate-black');
    if (!style) { style = document.createElement('style'); style.id = 'sc-donate-black'; style.textContent = css; }
    root.appendChild(style);                                 // siempre el último: gana a los bloques anteriores
    syncPayHeight(widget);
    return true;
  }
  // los otros botones copian la altura del botón real de Apple Pay (Stripe decide esa altura).
  // El elemento está en el light DOM del widget y su iframe aparece más tarde: se vigila con observadores.
  function syncPayHeight(widget) {
    if (widget.__scPayH) return;
    widget.__scPayH = true;
    function apply() {
      var el = widget.querySelector(':scope > [slot="express_checkout"]');   // su caja es la del marco blanco
      var h = el ? Math.round(el.offsetHeight) : 0;              // offsetHeight: sin la escala del widget en móvil
      if (h >= 36 && h <= 64) widget.style.setProperty('--sc-pay-h', h + 'px');
    }
    var ro = window.ResizeObserver ? new ResizeObserver(apply) : null;
    function watch() {
      var el = widget.querySelector(':scope > [slot="express_checkout"]');
      if (!el || el.__scWatched) return;
      el.__scWatched = true;
      if (ro) { ro.observe(el); var f = el.querySelector('iframe'); if (f) ro.observe(f); }
      new MutationObserver(function () { apply(); if (ro) { var f = el.querySelector('iframe'); if (f) ro.observe(f); } }).observe(el, { childList: true, subtree: true });
      apply();
    }
    watch();
    new MutationObserver(watch).observe(widget, { childList: true });
    [500, 1500, 3000, 6000].forEach(function (t) { setTimeout(function () { watch(); apply(); }, t); });
  }
  if (!mount()) {
    var finder = setInterval(function () { if (mount()) clearInterval(finder); }, 25);
    setTimeout(function () { clearInterval(finder); }, 15000);
  }
  var tries = 0, keep = setInterval(function () {
    if (++tries > 40) return clearInterval(keep);
    var w = document.querySelector('#page dbox-widget'); var r = w && w.shadowRoot; var s = r && r.querySelector('#sc-donate-black');
    if (s && s !== r.lastElementChild && r.lastElementChild.tagName === 'STYLE') r.appendChild(s);
  }, 250);
})();
</script>
