<!doctype html>
<html><head><meta charset="utf-8">
<title>Streetcat Floating Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preload" href="fonts/cg.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/cgi.woff" as="font" type="font/woff" crossorigin>
<style>
/* Cormorant Garamond (OFL), servida junto a la galería: subconjunto latino con el eje de peso 300–700 */
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/cg.woff) format("woff")}
@font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:300 700;font-display:swap;src:url(fonts/cgi.woff) format("woff")}
/* Layout: las obras flotan en una sala a oscuras con un foco en el centro; los mandos van en las esquinas, como cartelas. Solo tema oscuro, como streetcat.com. */
:root{
  color-scheme:dark;
  --bg:#0a0a0b;                       /* sala a oscuras */
  --ink:#f1efea;                      /* texto */
  --ink-2:rgba(241,239,234,.64);
  --ink-3:rgba(241,239,234,.4);
  --line:rgba(241,239,234,.22);
  --nav:#797979;                      /* gris de los enlaces del menú de streetcat.com */
  --mat:#f3f1ec;                      /* paspartú */
  --frame:#1c1b1a;                    /* marco de las obras físicas */
  --bezel:#0c0c0d;                    /* bisel de los NFT */
  --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --ease:cubic-bezier(.16,1,.3,1);    /* salida exponencial */
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  transition:opacity .6s ease,filter .6s ease}
#gl.is-drag{cursor:grabbing}
#gl.is-hit{cursor:pointer}
.nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2);font-size:19px}
.scrim{position:fixed;left:0;right:0;z-index:2;pointer-events:none;transition:opacity .45s ease}
.scrim-top{top:0;height:calc(90px + env(safe-area-inset-top,0px));background:linear-gradient(rgba(10,10,11,.75),transparent)}
.scrim-bottom{bottom:0;height:calc(120px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(10,10,11,.85))}

/* ---------- Pie: nº de obras (abajo a la izquierda) y vistas (abajo a la derecha).
   Solo texto, en Cormorant a 18 px y gris como el menú de streetcat.com; la vista activa, en blanco. ---------- */
.foot{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;
  justify-content:space-between;gap:16px;z-index:5;pointer-events:none;transition:opacity .45s ease}
.foot>*{pointer-events:auto}
.info{flex:none;margin:0;font-size:18px;line-height:24px;pointer-events:none}
.status{display:block;padding:5px 0;color:var(--ink);white-space:nowrap;font-variant-numeric:lining-nums}   /* alineado con el último renglón del menú de la derecha */
/* Abajo a la derecha, en renglones como el menú de la izquierda (Grid · Artist · Digital · Physical); en el ordenador desde el 16 oct 2026, antes en fila */
.modes{display:flex;flex-direction:column;flex-wrap:nowrap;align-items:flex-end;margin:0}
.modes button{height:34px;padding:5px 0;border:0;background:none;color:var(--nav);font-size:18px;line-height:24px;white-space:nowrap;cursor:pointer;transition:color .3s ease}
.modes button,.status{text-shadow:0 0 10px rgba(10,10,11,.9),0 0 3px rgba(10,10,11,.7)}   /* legibles aunque pase una obra clara por detrás */
.modes button:hover,.modes button[aria-pressed="true"]{color:var(--ink)}
.modes button:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
/* Abajo a la izquierda, en renglones: la selección (All Works · In Our Collection · Art We Love) y, debajo, el nº de obras */
.foot-left{display:flex;flex-direction:column;align-items:flex-start}
.sel{display:flex;flex-direction:column;align-items:flex-start;margin:0}
.sel button{height:34px;padding:5px 0;border:0;background:none;color:var(--nav);font-size:18px;line-height:24px;text-align:left;white-space:nowrap;cursor:pointer;
  transition:color .3s ease;text-shadow:0 0 10px rgba(10,10,11,.9),0 0 3px rgba(10,10,11,.7)}
.sel button:hover,.sel button[aria-pressed="true"]{color:var(--ink)}
.sel button:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.sel button[aria-disabled="true"],.modes button[aria-disabled="true"]{color:rgba(121,121,121,.42);cursor:default}   /* sin obras: atenuado */
/* Arriba a la derecha: «The Gallery ↵», el paso a la siguiente sección de streetcat.com (MwMA). Mismo texto que los menús (12 oct 2026). */
.next{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:16px;z-index:5;display:flex;align-items:center;gap:8px;height:44px;padding:0;
  color:var(--nav);font-size:18px;line-height:24px;font-style:italic;white-space:nowrap;text-decoration:none;cursor:pointer;transition:color .3s ease,opacity .45s ease;
  text-shadow:0 0 10px rgba(10,10,11,.9),0 0 3px rgba(10,10,11,.7)}                                  /* cursiva, como la fecha de What We Do (14 oct 2026) */
.next:hover{color:var(--ink)}
.next:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.next svg{flex:none;width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.only-mob{display:none}
/* Móvil */
@media (max-width:767px),(pointer:coarse) and (max-height:500px){
  .only-desk{display:none}
  .only-mob{display:block}
  .next{height:34px}                                                      /* a la misma distancia del borde que el pie */
  .scrim-bottom{height:calc(200px + env(safe-area-inset-bottom,0px))}
  .names{-webkit-mask-image:linear-gradient(transparent 6%,#000 26%,#000 60%,transparent 76%);mask-image:linear-gradient(transparent 6%,#000 26%,#000 60%,transparent 76%)}
}

/* ---------- Rótulo grande durante el cambio de vista: entra letra a letra ---------- */
.big{position:fixed;left:0;right:0;top:50%;margin:0;transform:translateY(-50%);text-align:center;font-style:normal;   /* Cormorant recta, como el menú (v7.7) */
  font-size:min(clamp(58px,14vw,172px),calc(180vw / var(--len,6)));       /* los rótulos largos («Arte que amamos») encogen para caber, con margen a los lados */
  font-weight:400;line-height:1;letter-spacing:.01em;color:var(--ink);pointer-events:none;z-index:3;white-space:nowrap}
.big span{display:inline-block;opacity:0;will-change:transform,opacity,filter}      /* las letras las anima GSAP */

/* ---------- Lista de títulos (vista «Títulos») ---------- */
.names{position:fixed;top:0;bottom:0;left:43%;right:16px;z-index:4;pointer-events:none;opacity:0;transition:opacity .5s ease;
  -webkit-mask-image:linear-gradient(transparent 6%,#000 28%,#000 72%,transparent 94%);mask-image:linear-gradient(transparent 6%,#000 28%,#000 72%,transparent 94%)}
.names.is-on{opacity:1}
.names button{position:absolute;left:0;right:0;top:50%;height:40px;margin-top:-20px;display:flex;align-items:center;padding:0;border:0;background:none;
  color:var(--ink-2);font-size:23px;line-height:1;text-align:left;white-space:nowrap;pointer-events:none;will-change:transform,opacity}
.names button span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.names button::before{content:"";flex:none;width:0;height:1px;margin-right:0;background:currentColor;transition:width .45s var(--ease),margin .45s var(--ease)}
.names button.is-active{color:var(--ink);font-style:italic}
.names button.is-active::before{width:24px;margin-right:12px}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  .names{left:57%}
  .names button{height:50px;margin-top:-25px;font-size:32px}
  .names button.is-active::before{width:34px;margin-right:16px}
}

/* ---------- Etiqueta que acompaña al cursor ---------- */
.pill{position:fixed;left:0;top:0;padding:5px 12px 6px;border-radius:2px;background:var(--ink);color:var(--bg);font-size:15px;letter-spacing:.06em;
  white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s ease;z-index:6}
.pill.is-on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr:focus-within{position:fixed;left:16px;top:64px;width:auto;height:auto;max-height:70vh;overflow:auto;clip:auto;z-index:9;display:flex;flex-direction:column;gap:2px;
  padding:10px;background:var(--bg);border:1px solid var(--line)}
.sr button{background:none;border:0;text-align:left;font-size:17px;padding:4px 6px;cursor:pointer}
.sr button:focus-visible{outline:2px solid var(--ink)}

/* ---------- Ficha: la obra (en 3D) viene al centro; debajo, título y artista; al bajar, el resto de la información.
   El fondo es la propia obra muy difuminada (se pinta en el 3D). ---------- */
body.is-focus .foot,body.is-focus .names,body.is-focus .pill,body.is-focus .scrim,body.is-focus .next{opacity:0;pointer-events:none}
.focus{position:fixed;inset:0;z-index:10;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.focus::-webkit-scrollbar{display:none}
.focus[hidden]{display:none}
.focus-stage{position:relative;height:100%}
.focus-head{position:absolute;left:0;right:0;top:76%;margin:0;padding:0 24px;text-align:center}
.ficha-title{margin:0;font-size:clamp(28px,7.4vw,40px);line-height:1.04;font-weight:500;font-style:italic;text-wrap:balance}
.ficha-by{margin:7px 0 0;font-size:18px;line-height:1.3;color:var(--ink-2)}
.ficha{width:100%;max-width:480px;margin:0 auto;padding:16px 24px calc(84px + env(safe-area-inset-bottom,0px));text-align:left}
.ficha-kicker{margin:0;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2)}
.ficha-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:14px 0 0;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:17px}
.ficha-dl dt{color:var(--ink-3);font-size:12px;letter-spacing:.22em;text-transform:uppercase;align-self:center}
.ficha-dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ficha-dl .ficha-ln{display:block;width:fit-content}
.ficha-dl .ficha-ln + .ficha-ln{margin-top:4px}
.ficha-desc{margin:16px 0 0;font-size:18px;line-height:1.5;color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere}
.ficha [hidden],.focus-head [hidden]{display:none!important}
.ficha-link{display:table;margin:44px auto 0;padding:11px 24px;                                     /* móvil: centrado en la pantalla y separado del texto */border:1px solid var(--ink);color:var(--ink);text-decoration:none;font-size:14px;letter-spacing:.24em;
  text-transform:uppercase;transition:background .25s,color .25s}
.ficha-link:hover,.ficha-link:focus-visible{background:var(--ink);color:var(--bg);outline:none}
.ficha-link[aria-disabled="true"]{opacity:.45;cursor:default}
.ficha-by a,.ficha-dl a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em;
  text-decoration-color:rgba(255,255,255,.35);transition:text-decoration-color .3s ease}
.ficha-by a:hover,.ficha-by a:focus-visible,.ficha-dl a:hover,.ficha-dl a:focus-visible{text-decoration-color:currentColor;outline:none}
.ficha-views{display:grid;gap:12px;margin-top:32px}
.ficha-views[hidden]{display:none}
.ficha-views img{display:block;width:100%;height:auto;background:#0c0c0c}
.focus-close{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:11;height:44px;padding:0 14px;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);opacity:0}
.focus-close svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.4;fill:none}
.focus-close:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  .ficha-title{font-size:46px}
  .ficha-by{font-size:20px}
  .ficha{max-width:520px;padding-top:28px}
  /* ordenador: «Ver NFT» es texto discreto, con el tono, la tipografía y el tamaño de las etiquetas de los datos, y a su mismo margen */
  .ficha-link{display:inline-block;margin:16px 0 0;padding:0;border:0;background:none;color:var(--ink-3);font-size:12px;line-height:1.4;letter-spacing:.22em;transition:color .3s ease}
  .ficha-link:hover,.ficha-link:focus-visible{background:none;color:var(--ink)}
  .ficha-link:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
}
/* Ordenador con pantalla ancha (≥ 1100 px): toda la ficha a la vista, sin bajar. A la izquierda de la obra, la cabecera, los datos y «Ver NFT»
   (como una etiqueta más, bajo el bloque); a la derecha, la descripción en un tambor que gira con el scroll (como los anillos de la galería).
   La colocan focusFrame y placeHead. */
.ficha-drum,.drum-meas{display:none}
.focus.is-tri{overflow:hidden}
.focus.is-tri .ficha{position:absolute;left:0;top:0;width:auto;max-width:none;margin:0;padding:0}
.focus.is-tri .ficha-desc{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0)}   /* la lee el lector de pantalla; a la vista va en el tambor */
.focus.is-tri .ficha-drum{display:block;position:absolute;overflow:visible;perspective:900px;perspective-origin:0 50%;cursor:ns-resize;touch-action:none;
  user-select:none;-webkit-user-select:none}                                /* perspectiva desde el borde izquierdo: el margen del texto queda recto */
.focus.is-tri .ficha-drum[hidden]{display:none}
.ficha-drum .ln{position:absolute;left:0;right:0;top:0;height:28px;font-size:18px;line-height:28px;color:var(--ink-2);white-space:nowrap;pointer-events:none;
  transform-origin:0 50%;will-change:transform,opacity;backface-visibility:hidden}
.drum-meas{position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;font-size:18px;line-height:28px;white-space:normal}
.focus.is-tri .drum-meas{display:block}
@media (prefers-reduced-motion:reduce){ .names button::before{transition:none} }
#vids{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1}   /* vídeos de las obras animadas (ocultos) */
#safe{position:fixed;left:0;top:0;width:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}   /* márgenes seguros (los lee la ficha) */
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<div id="vids" aria-hidden="true"></div>
<div id="safe" aria-hidden="true"></div>
<div class="scrim scrim-top" aria-hidden="true"></div>
<div class="scrim scrim-bottom" aria-hidden="true"></div>
<p class="big" id="big" aria-hidden="true"></p>
<div class="names" id="names" aria-hidden="true"></div>
<div class="pill" id="pill" aria-hidden="true"></div>
<nav class="sr" id="worklist"></nav>
<a class="next" id="next" href="https://www.streetcat.com/the-meowma" target="_top">The Gallery<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14 2.5v7.5H2.5M6.5 6l-4 4 4 4"/></svg></a>
<div class="foot">
  <div class="foot-left">
    <nav class="sel" id="sel">
      <button type="button" data-s="all" aria-pressed="true" data-t="sAll">All Works</button>
      <button type="button" data-s="collection" aria-pressed="false" data-t="sCol">In Our Collection</button>
      <button type="button" data-s="love" aria-pressed="false" data-t="sLove">Art We Love</button>
    </nav>
    <p class="info"><span class="status" id="status" aria-live="polite"></span></p>
  </div>
  <nav class="modes" id="modes">
    <button type="button" data-m="grid" aria-pressed="true" data-t="mGrid">Grid</button>
    <button type="button" data-m="names" aria-pressed="false" data-t="mArtist">Artist</button>
    <button type="button" data-m="digital" aria-pressed="false" data-t="mDig">Digital</button>
    <button type="button" data-m="physical" aria-pressed="false" data-t="mPhys">Physical</button>
  </nav>
</div>
<div class="focus" id="focus" hidden role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <button class="focus-close" id="fClose" type="button"><span data-t="close">Close</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <div class="focus-stage" id="fStage">
    <div class="focus-head" id="fHead">
      <h2 class="ficha-title" id="fTitle"></h2>
      <p class="ficha-by" id="fBy"></p>
    </div>
  </div>
  <article class="ficha" id="ficha">
    <p class="ficha-kicker" id="fKick"></p>
    <dl class="ficha-dl" id="fDl"></dl>
    <div class="ficha-more" id="fMore">
      <p class="ficha-desc" id="fDesc"></p>
      <a class="ficha-link" id="fLink" target="_blank" rel="noopener"></a>
      <div class="ficha-views" id="fViews" hidden></div>
    </div>
  </article>
  <div class="ficha-drum" id="fDrum" aria-hidden="true" hidden></div>
  <div class="drum-meas" id="fDrumMeas" aria-hidden="true"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/+esm';
(() => {
'use strict';
/* =====================================================================
   OBRAS — vienen de catalogo-web.json (lo genera gen/felino.py a partir de «100 Lost Cats»: catalogo.json + Por clasificar/inventario.json).
   Una entrada por obra, con su ID estable. Campos que usa la galería:
     id · kind ('digital' | 'physical' | null = sin clasificar) · category · nft · title · artist · creator_account · creator_address
     artist_links[] · technique {es,en} · format {es,en} · year · collection · description · blockchain {…} · explorer_url · marketplace_url
     links[] · media {ratio, pixel, alpha, grid_image, grid_video, ficha_image, ficha_video} · pending_review · selection ('collection' | 'love')
   Lo desconocido llega vacío (null) y no se muestra. Las imágenes y vídeos ligeros van en el grid; los de la ficha se cargan al abrirla.

        else if (foc && FOCUS.hi && FOCUS.hi.tex && !w.video) { tex = FOCUS.hi.tex; reveal = 1; }

/* ---------- Dónde está cada universo (lo mueven las transiciones) ---------- */

/* ---------- Física de cada vista: la de 100 Lost Species, con sus mismos números ----------
   El arrastre fija un «impulso» = último desplazamiento × 0,01 (ratón) o × 0,015 (dedo). En cada fotograma el impulso se queda
   en un 15 % y la velocidad se acerca a él (dt·1,5 con ratón, dt·4 con el dedo); los anillos suman la velocidad.
   Así un gesto pequeño mueve mucho y se desliza con suavidad: ligero. Artist: posición en la lista, suavizada igual. */
const GR = {ix: 0, iy: 0, vx: 0, vy: 0, S: 0, tilt: 0, fr: -1};
const NM = {target: 0, cur: 0, sq: 0, ga: 0, gb: 0, endT: 0, rew: null};
const RW = {ix: 0, vx: 0, fr: -1};
const PUSH = {v: 0};
const LOOK = {x: 0, y: 0, ix: 0, iy: 0};                                  // ratón suavizado e intensidad de la mirada (la animan las vistas)
const DRAG = () => TOUCH ? .015 : .01;                                    // impulso por píxel arrastrado
let INV = 0;                                                              // «velocidad de entrada» de la vista activa
function physics(dt){
  const f = Math.min(1, dt * (TOUCH ? 4 : 1.5)), zi = 1 - FX.zoomIn;
  INV = 0;
  { // Grid: tres anillos con paralaje (0,8 · 1 · 0,6)
    const U = UNI.grid, P = U.p, oi = P.open * (1 - P.close);
    GR.ix *= .15; GR.iy *= .15;
    GR.vx += (GR.ix - GR.vx) * f; GR.vy += (GR.iy - GR.vy) * f;
    GR.S = damp(GR.S, Math.abs(GR.vx * 40), .5, dt) * .95 * zi;           // con velocidad, los anillos de arriba y abajo se separan
    const iv = GR.vx * 700;
    P.lag -= (P.lag - clamp(iv, -10, 10)) * .08 * (TOUCH ? .1 : .7);      // y cada obra se adelanta un poco (con el dedo, muy despacio)
    const d = GR.vx * zi;                                                // cuando nadie toca, los anillos se quedan quietos (como en la referencia)
    for (let r = 0; r < 3; r++) U.rows[r].x += d * U.cfg.parallax[r];
    P.spd = GR.S * oi; U.rows[0].y = GR.S * 4 * oi; U.rows[2].y = -GR.S * 4 * oi;
    if (TOUCH && !FOCUS.on) { GR.tilt = clamp(GR.tilt + GR.vy * .5 * zi, -.6, .6); GR.tilt *= Math.pow(.994, dt * 60); }   // con el dedo, arrastrar en vertical inclina el cilindro
    else GR.tilt = damp(GR.tilt, 0, 3, dt);

  { // Artist: tambor horizontal; la lista va de la primera a la última

    const iv = (NM.target - NM.cur) * 3;
    NM.sq = damp(NM.sq, FOCUS.on ? 0 : Math.min(.99, Math.abs(iv) / 7), .9, dt * 5);
    P.squeeze = NM.sq;                                                    // al pasar rápido, las del centro encogen
    const base = -NM.cur / N * .99 * TAU, par = U.cfg.parallax;
    NM.ga += dt * par[0] * .012; NM.gb += dt * par[2] * .018;             // las filas laterales giran solas, muy despacio
    U.rows[1].x = base * par[1]; U.rows[0].x = base * par[0] - NM.ga; U.rows[2].x = base * par[2] - NM.gb;

    const d = RW.vx * zi;

}
function drag(ddx, ddy){                                                  // ddx, ddy: lo que se ha movido el dedo, con el signo de la referencia (hacia la izquierda/arriba, positivo)
  const k = DRAG();
  if (view === 'grid') { if (GR.fr !== frameNo) { GR.fr = frameNo; GR.ix = GR.iy = 0; } GR.ix += ddx * k; GR.iy = clamp(GR.iy + ddy * k, -.2, .2); }
  else if (view === 'names') NM.target = clamp(NM.target + ddy * k, 0, N - 1);

  const nx = clamp(mx / W * 2 - 1, -1, 1), ny = clamp(1 - my / H * 2, -1, 1);

/* ---------- Calidad adaptable: si el dispositivo va justo, baja resolución, antialiasing y resplandor ---------- */
const perf = {n: 0, sum: 0};
function adapt(dt){
  if (Q.locked || document.hidden || !started || now - started < 4000 || !dt) return;
  perf.sum += dt; perf.n++;

<script>
// Avisa a la página que aloja la galería (streetcat.com) de cuándo hay una ficha al frente y de si se ha llegado
// al final de la ficha (pasado el botón del NFT), para que esconda su menú móvil y lo deje volver abajo del todo.
// El iframe es de otro dominio: va por postMessage.
(function(){
  if (window.self === window.top) return;
  var focusEl = document.getElementById('focus'), last = '';
  function atEnd(){
    if (!focusEl || focusEl.hidden) return false;
    return focusEl.scrollTop + focusEl.clientHeight >= focusEl.scrollHeight - 24;
  }
  function tell(){
    var open = document.body.classList.contains('is-focus'), end = open && atEnd(), key = open + '/' + end;
    if (key === last) return;
    last = key;
    parent.postMessage({streetcat: 'ficha', open: open, end: end}, '*');
  }
  new MutationObserver(tell).observe(document.body, {attributes: true, attributeFilter: ['class']});
  if (focusEl) focusEl.addEventListener('scroll', tell, {passive: true});
  addEventListener('resize', tell);
  tell();
})();
</script>
